default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  username: postgres
  password: postgres

development:
  <<: *default
  database: erp_caspia_backend_development

  
test:
  <<: *default
  database: erp_caspia_backend_test

production:
  primary: &primary_production
    <<: *default
    database: erp_caspia_backend_production
    username: erp_caspia_backend
    password: <%= ENV["ERP_CASPIA_BACKEND_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: erp_caspia_backend_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: erp_caspia_backend_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: erp_caspia_backend_production_cable
    migrations_paths: db/cable_migrate
